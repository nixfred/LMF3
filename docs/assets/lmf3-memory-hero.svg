<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">LMF3 Persistent Memory for Claude Code</title>
  <desc id="desc">A memory loop moves sessions through automatic extraction, durable files, SQLite search, and recall into the next Claude Code session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#171126"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".04"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="720" rx="34" fill="url(#bg)"/><rect width="1600" height="720" rx="34" fill="url(#grid)"/><circle cx="1270" cy="350" r="430" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="98" y="116" fill="#60a5fa" font-size="20" font-weight="700" letter-spacing="7">LARRY MEMORY FRAMEWORK · V4.1</text>
    <text x="92" y="241" fill="#f8fafc" font-size="94" font-weight="800">LMF3</text>
    <text x="98" y="316" fill="#cbd5e1" font-size="32" font-weight="700">PERSISTENT MEMORY FOR CLAUDE CODE</text>
    <text x="98" y="374" fill="#94a3b8" font-size="24">Sessions end. Context does not.</text>
    <g transform="translate(98 457)" filter="url(#shadow)"><rect width="750" height="126" rx="16" fill="#111827" stroke="#334155"/><text x="30" y="42" fill="#a78bfa" font-size="17" font-weight="700" letter-spacing="3">MEMORY CONTRACT</text><text x="30" y="84" fill="#f8fafc" font-size="24" font-weight="700">EXTRACT · INDEX · SEARCH · RECALL</text></g>
    <text x="98" y="652" fill="#64748b" font-size="17">SQLITE · FTS5 · OPTIONAL VECTORS · MCP · CLI · HUMAN READABLE ARCHIVE</text>
  </g>
  <g transform="translate(1005 118)" font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <circle cx="230" cy="240" r="184" fill="#0d1421" stroke="#27364c" stroke-width="3"/>
    <path d="M230 70 C365 70 414 203 381 300 C345 407 215 455 123 381 C22 299 64 142 171 91" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <path d="M160 72 L190 88 L168 112" fill="#60a5fa"/>
    <g text-anchor="middle">
      <circle cx="230" cy="70" r="36" fill="#13233c" stroke="#60a5fa" stroke-width="3"/><text x="230" y="76" fill="#eff6ff" font-size="15" font-weight="700">SESSION</text>
      <circle cx="385" cy="208" r="36" fill="#231a3b" stroke="#a78bfa" stroke-width="3"/><text x="385" y="214" fill="#f7f2ff" font-size="14" font-weight="700">EXTRACT</text>
      <circle cx="295" cy="401" r="36" fill="#231a3b" stroke="#a78bfa" stroke-width="3"/><text x="295" y="407" fill="#f7f2ff" font-size="14" font-weight="700">INDEX</text>
      <circle cx="78" cy="304" r="36" fill="#123128" stroke="#34d399" stroke-width="3"/><text x="78" y="310" fill="#effff8" font-size="14" font-weight="700">RECALL</text>
      <circle cx="230" cy="240" r="70" fill="#141c2b" stroke="url(#line)" stroke-width="4" filter="url(#soft)"/><text x="230" y="229" fill="#f8fafc" font-size="19" font-weight="800">MEMORY</text><text x="230" y="259" fill="#c4b5fd" font-size="16" font-weight="700">PERSISTS</text>
    </g>
  </g>
  <rect x="2" y="2" width="1596" height="716" rx="32" fill="none" stroke="#27364c" stroke-width="4"/>
</svg>
